<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SocialNexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============ AUTH SCREEN ============ -->
<section id="authScreen" class="auth-screen">
  <div class="auth-card">
    <h1 class="auth-logo">Nexus</h1>
    <p class="auth-tag">a quieter corner of the internet</p>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Log in</button>
      <button class="auth-tab" data-tab="signup">Sign up</button>
    </div>

    <form id="loginForm" class="auth-form">
      <input type="email" id="loginEmail" placeholder="Email" required />
      <input type="password" id="loginPassword" placeholder="Password" required />
      <button type="submit" class="btn-primary">Log in</button>
      <p class="auth-error" id="loginError"></p>
    </form>

    <form id="signupForm" class="auth-form hidden">
      <input type="text" id="signupUsername" placeholder="Username" required />
      <input type="email" id="signupEmail" placeholder="Email" required />
      <input type="password" id="signupPassword" placeholder="Password (min 6 chars)" required minlength="6" />
      <button type="submit" class="btn-primary">Create account</button>
      <p class="auth-error" id="signupError"></p>
    </form>
  </div>
</section>

<!-- ============ MAIN APP ============ -->
<div id="app" class="app hidden">

  <!-- Top bar -->
  <header class="topbar">
    <span class="topbar-logo">Nexus</span>
    <div class="topbar-actions">
      <button class="icon-btn" id="openExploreBtn" title="Explore" aria-label="Explore">✦</button>
      <button class="icon-btn" id="openChatBtn" title="Messages" aria-label="Messages">✉</button>
      <button class="icon-btn" id="logoutBtn" title="Log out" aria-label="Log out">⏻</button>
    </div>
  </header>

  <!-- Stories rail -->
  <section class="stories-rail" id="storiesRail">
    <div class="story-bubble add-story" id="addStoryBtn">
      <div class="story-ring add">＋</div>
      <span>Your story</span>
    </div>
    <!-- story bubbles injected here -->
  </section>

  <!-- On This Day banner (hidden unless there's a memory) -->
  <section id="onThisDay" class="on-this-day hidden">
    <div class="otd-inner">
      <span class="otd-label">On this day</span>
      <div class="otd-scroll" id="otdScroll"></div>
    </div>
  </section>

  <!-- Views: feed / explore / chat -->
  <main class="view-container">

    <!-- FEED VIEW -->
    <section id="feedView" class="view active">
      <div id="pinnedSlot"></div>
      <div id="feedList" class="feed-list"></div>
    </section>

    <!-- EXPLORE VIEW -->
    <section id="exploreView" class="view">
      <h2 class="view-title">Explore</h2>
      <div id="hashtagCloud" class="hashtag-cloud"></div>
      <div id="exploreFeed" class="feed-list"></div>
    </section>

    <!-- CHAT VIEW -->
    <section id="chatView" class="view">
      <div class="chat-shell">
        <div class="chat-list-pane" id="chatListPane">
          <div class="chat-list-header">
            <h2 class="view-title">Messages</h2>
            <button class="icon-btn" id="newChatBtn" title="New message">＋</button>
          </div>
          <div id="conversationList"></div>
        </div>
        <div class="chat-thread-pane hidden" id="chatThreadPane">
          <div class="chat-thread-header">
            <button class="icon-btn" id="backToChatList">←</button>
            <span id="chatThreadName"></span>
          </div>
          <div class="chat-messages" id="chatMessages"></div>
          <form id="chatSendForm" class="chat-send-form">
            <input type="text" id="chatInput" placeholder="Message..." autocomplete="off" />
            <button type="submit" class="btn-primary small">Send</button>
          </form>
        </div>
      </div>
    </section>

  </main>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="feedView">Feed</button>
    <button class="nav-btn" data-view="exploreView">Explore</button>
    <button class="nav-btn nav-post" id="openComposerBtn">Post</button>
    <button class="nav-btn" data-view="chatView">Chat</button>
  </nav>
</div>

<!-- ============ COMPOSER MODAL (post/reel) ============ -->
<div id="composerModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-header">
      <h3>New post</h3>
      <button class="icon-btn" id="closeComposerBtn">✕</button>
    </div>
    <div class="composer-type-toggle">
      <button class="type-btn active" data-type="post">Photo / Carousel</button>
      <button class="type-btn" data-type="reel">Reel (video)</button>
    </div>
    <textarea id="composerCaption" placeholder="Write a caption... use #hashtags" maxlength="2200"></textarea>
    <input type="file" id="composerFiles" accept="image/*" multiple />
    <div id="composerPreview" class="composer-preview"></div>
    <label class="checkbox-row">
      <input type="checkbox" id="composerPin" /> Pin this post to the top of my profile
    </label>
    <button class="btn-primary" id="submitPostBtn">Share</button>
    <p class="auth-error" id="composerError"></p>
  </div>
</div>

<!-- ============ STORY UPLOAD MODAL ============ -->
<div id="storyModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-header">
      <h3>Add to story</h3>
      <button class="icon-btn" id="closeStoryModalBtn">✕</button>
    </div>
    <input type="file" id="storyFile" accept="image/*,video/*" />
    <div id="storyPreview" class="composer-preview"></div>
    <label class="checkbox-row">
      <input type="checkbox" id="storyReverseReveal" /> Reverse reveal (blurred until viewer holds)
    </label>
    <button class="btn-primary" id="submitStoryBtn">Share to story</button>
    <p class="auth-error" id="storyError"></p>
  </div>
</div>

<!-- ============ STORY VIEWER ============ -->
<div id="storyViewer" class="story-viewer hidden">
  <div class="story-viewer-bar" id="storyProgressBar"></div>
  <button class="story-close" id="closeStoryViewerBtn">✕</button>
  <div class="story-viewer-media" id="storyViewerMedia"></div>
  <div class="story-viewer-footer">
    <input type="text" id="storyReplyInput" placeholder="Reply to story..." autocomplete="off" />
    <button class="btn-primary small" id="storyReplySendBtn">Send</button>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
